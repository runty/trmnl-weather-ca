uuid: ""
name: "Canadian Weather Forecast"
author: "phobus"
description: >
  Current conditions, 24-hour hourly forecast with precipitation bars,
  and 7-day forecast. Data direct from Environment Canada API.

markup_version: 1
strategy: polling
refresh_frequency: 3600  # 1 hour

polling_url: "https://api.weather.gc.ca/collections/citypageweather-realtime/items/{{station}}?f=json&lang=en"
polling_verb: GET

layouts:
  - full
  - half_horizontal
  - half_vertical
  - quadrant

- keyname: author_info
  field_type: author_bio
  name: About
  category: environment
  description: "Canadian weather forecast from Environment Canada. Updated hourly.<br><br>Built by <a href='https://github.com/runty' target='_blank'>runty</a>"

- keyname: latitude
  field_type: string
  name: Latitude
  description: "Your latitude (e.g. 49.28 for Vancouver)"
  placeholder: "49.28"
  default: "49.28"

- keyname: longitude
  field_type: string
  name: Longitude
  description: "Your longitude (e.g. -123.12 for Vancouver)"
  placeholder: "-123.12"
  default: "-123.12"

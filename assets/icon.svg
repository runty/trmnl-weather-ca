<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86c1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#0d3b66" stroke-width="8"/>

  <!-- Sun (top right) -->
  <circle cx="370" cy="130" r="45" fill="#f4d03f"/>
  <!-- Sun rays -->
  <line x1="370" y1="70" x2="370" y2="55" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="370" y1="205" x2="370" y2="190" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="310" y1="130" x2="295" y2="130" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="430" y1="130" x2="445" y2="130" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="328" y1="88" x2="317" y2="77" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="412" y1="172" x2="423" y2="183" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="412" y1="88" x2="423" y2="77" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>
  <line x1="328" y1="172" x2="317" y2="183" stroke="#f4d03f" stroke-width="8" stroke-linecap="round"/>

  <!-- Cloud (behind maple leaf, subtle) -->
  <ellipse cx="180" cy="175" rx="70" ry="40" fill="white" opacity="0.3"/>
  <ellipse cx="230" cy="165" rx="55" ry="35" fill="white" opacity="0.3"/>
  <ellipse cx="145" cy="170" rx="45" ry="30" fill="white" opacity="0.25"/>

  <!-- Maple leaf (centered, large) -->
  <g transform="translate(256, 290) scale(2.8)">
    <path d="M 0,-55
      L 5,-40 20,-45 15,-30 30,-30 18,-18 25,-5 12,-10 5,0
      L 10,15 20,10 15,25 25,30 10,30 5,40 0,55
      L -5,40 -10,30 -25,30 -15,25 -20,10 -10,15 -5,0
      L -12,-10 -25,-5 -18,-18 -30,-30 -15,-30 -20,-45 -5,-40 Z"
      fill="#cc0000" stroke="#8b0000" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Leaf vein -->
    <line x1="0" y1="-45" x2="0" y2="55" stroke="#8b0000" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Small snowflakes (bottom left, subtle) -->
  <text x="85" y="400" font-size="28" fill="white" opacity="0.25">❄</text>
  <text x="110" y="430" font-size="20" fill="white" opacity="0.2">❄</text>

  <!-- Rain drops (bottom right, subtle) -->
  <circle cx="400" cy="380" r="3" fill="#85c1e9" opacity="0.3"/>
  <circle cx="415" cy="400" r="3" fill="#85c1e9" opacity="0.3"/>
  <circle cx="390" cy="415" r="3" fill="#85c1e9" opacity="0.25"/>
  <circle cx="420" cy="430" r="3" fill="#85c1e9" opacity="0.2"/>

  <!-- "EC" text at bottom -->
  <text x="256" y="480" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="32" fill="white" letter-spacing="4" opacity="0.7">ENVIRONMENT CANADA</text>
</svg>
